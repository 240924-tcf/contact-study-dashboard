<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接触网智能复习题包</title><style>
:root{--bg:#f3f5f7;--s:#fff;--text:#172027;--muted:#66737c;--line:#d8e0e5;--blue:#1769aa;--blue2:#e3f1fa;--green:#287d4f;--green2:#e4f3ea;--red:#b43b3b;--red2:#fae5e5;--dark:#20292f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}button,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--dark);color:#fff;padding:20px 14px;display:flex;flex-direction:column}.brand{padding:0 10px 20px}.brand b{font-size:17px}.brand small{display:block;color:#aeb8be}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8d0d5;text-align:left;padding:11px 12px;border-radius:6px}.nav button.active,.nav button:hover{background:#35424a;color:#fff}.foot{margin-top:auto;color:#9eabb2;padding:10px;font-size:12px}.main{min-width:0}.top{height:64px;background:var(--s);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top h1{font-size:18px}.mobile{display:none}.content{max-width:1280px;margin:auto;padding:24px 28px 50px}.view{display:none}.view.active{display:block}.hero,.panel,.metric,.qcard,.wrong{background:var(--s);border:1px solid var(--line);border-radius:7px}.hero{padding:24px;margin-bottom:16px}.hero h2{margin:0 0 7px;font-size:22px}.hero p,.wrong p{margin:0;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric{padding:15px}.metric span{color:var(--muted);font-size:12px}.metric b{display:block;font-size:24px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{padding:18px}.panel h3{margin:0 0 12px}.modules{display:grid;gap:11px}.mod{display:grid;grid-template-columns:150px 1fr 50px;gap:10px;align-items:center}.track{height:8px;background:#e8edf0;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--blue)}.mod small{text-align:right;color:var(--muted)}.toolbar{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:4px}.field label{font-size:12px;color:var(--muted)}select,.btn,textarea{border:1px solid var(--line);background:var(--s);border-radius:6px}.field select{padding:8px}.btn{padding:8px 12px;min-height:38px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.practice{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}.qcard{padding:22px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:14px}.tag{background:var(--blue2);color:#155b8e;border-radius:4px;padding:3px 7px;margin-right:5px}.qtext{font-size:17px;font-weight:500;line-height:1.8;margin-bottom:14px}.qimg{max-width:100%;max-height:420px;display:block;margin:12px auto}.options{display:grid;gap:9px}.option{border:1px solid var(--line);background:var(--s);padding:11px;text-align:left;border-radius:6px}.option.selected{background:var(--blue2);border-color:var(--blue)}.option.correct{background:var(--green2);border-color:var(--green)}.option.wrong{background:var(--red2);border-color:var(--red)}.answer{display:none;margin-top:15px;padding:13px;background:var(--green2);border-left:4px solid var(--green)}.answer.show{display:block}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.wronglist{display:grid;gap:12px}.wrong{padding:16px}.wrong h3{font-size:15px;margin:0 0 8px}.notegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.notegrid textarea{min-height:72px;padding:9px}.note-actions{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.empty{text-align:center;color:var(--muted);padding:50px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.kgrid{display:grid;grid-template-columns:220px 1fr;gap:16px}.knav{display:grid;gap:5px;align-content:start}.knav button{border:0;background:transparent;padding:9px;text-align:left}.knav button.active{background:var(--blue2)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.top{padding:0 14px}.top h1{display:none}.mobile{display:block;padding:7px}.content{padding:16px}.metrics{grid-template-columns:1fr 1fr}.grid,.practice,.kgrid{grid-template-columns:1fr}.mod{grid-template-columns:105px 1fr 40px}.notegrid{grid-template-columns:1fr}.qcard{padding:16px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>接触网智能复习</b><small>780题 · 35幅图片</small></div><nav class="nav"><button class="active" data-v="home">学习概览</button><button data-v="practice">模块练习</button><button data-v="wrong">错题知识点速记</button><button data-v="knowledge">知识点总览</button></nav><div class="foot">进度和笔记保存在当前浏览器。</div></aside><main class="main"><header class="top"><h1 id="title">学习概览</h1><select class="mobile" id="mobile"><option value="home">学习概览</option><option value="practice">模块练习</option><option value="wrong">错题速记</option><option value="knowledge">知识点总览</option></select><button class="btn primary" id="quick">开始练习</button></header><div class="content">
<section class="view active" id="home"><div class="hero"><h2>完整题库模块化复习</h2><p>收录780道题和35幅原题图片。客观题自动判分，填空与问答题展开答案后自行评估；错题可记录知识点、错误原因和正确记忆句。</p></div><div class="metrics"><div class="metric"><span>题库总量</span><b>780</b></div><div class="metric"><span>已练题次</span><b id="attempts">0</b></div><div class="metric"><span>客观题正确率</span><b id="accuracy">--</b></div><div class="metric"><span>错题速记</span><b id="wrongCount">0</b></div></div><div class="grid"><div class="panel"><h3>模块掌握度</h3><div class="modules" id="moduleBars"></div></div><div class="panel"><h3>题型分布</h3><table class="table" id="types"></table></div></div></section>
<section class="view" id="practice"><div class="toolbar"><div class="field"><label>知识模块</label><select id="module"><option value="all">全部模块</option></select></div><div class="field"><label>题型</label><select id="type"><option value="all">全部题型</option></select></div><button class="btn" id="random">随机一题</button></div><div class="practice"><div class="qcard"><div class="meta"><div id="tags"></div><span id="qid"></span></div><div class="qtext" id="qtext"></div><div id="imgs"></div><div class="options" id="options"></div><div class="answer" id="answer"></div><div class="actions"><button class="btn" id="addWrong">加入错题速记</button><button class="btn primary" id="answerBtn">查看答案</button></div></div><aside class="panel"><h3>本轮练习</h3><div class="stat"><span>已答</span><b id="sdone">0</b></div><div class="stat"><span>答对</span><b id="scorrect">0</b></div><div class="stat"><span>当前题池</span><b id="pool">780</b></div></aside></div></section>
<section class="view" id="wrong"><div class="toolbar"><select id="wrongModule"><option value="all">全部模块</option></select><button class="btn" id="exportNotes">导出速记</button><button class="btn danger" id="clearMastered">清除已掌握</button></div><div class="wronglist" id="wrongList"></div></section>
<section class="view" id="knowledge"><div class="kgrid"><div class="panel knav" id="knav"></div><article class="panel" id="kbody"></article></div></section>
</div></main></div><script src="data.js"></script><script>
const Q=window.QUESTION_BANK||[],KEY='contact-full-v2',M=[...new Set(Q.map(x=>x.module))],T=[...new Set(Q.map(x=>x.typeName))];let S=JSON.parse(localStorage.getItem(KEY)||'null')||{attempts:0,correct:0,objective:0,wrong:{},mods:{}},cur,selected,revealed=false,session={done:0,correct:0};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function save(){localStorage.setItem(KEY,JSON.stringify(S))}function view(id){$$('.view').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===id));$('#mobile').value=id;if(id==='home')home();if(id==='wrong')renderWrong();if(id==='knowledge')knowledge()}$$('.nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));$('#mobile').onchange=e=>view(e.target.value);$('#quick').onclick=()=>{view('practice');next()};M.forEach(m=>{$('#module').add(new Option(m,m));$('#wrongModule').add(new Option(m,m))});T.forEach(t=>$('#type').add(new Option(t,t)));
function home(){$('#attempts').textContent=S.attempts;$('#accuracy').textContent=S.objective?Math.round(S.correct/S.objective*100)+'%':'--';$('#wrongCount').textContent=Object.keys(S.wrong).length;$('#moduleBars').innerHTML=M.map(m=>{let x=S.mods[m]||{a:0,c:0},p=x.a?Math.round(x.c/x.a*100):0;return `<div class="mod"><span>${m}</span><div class="track"><div class="bar" style="width:${p}%"></div></div><small>${p}%</small></div>`}).join('');let c={};Q.forEach(q=>c[q.typeName]=(c[q.typeName]||0)+1);$('#types').innerHTML='<tr><th>题型</th><th>数量</th></tr>'+Object.entries(c).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}
function getPool(){return Q.filter(q=>($('#module').value==='all'||q.module===$('#module').value)&&($('#type').value==='all'||q.typeName===$('#type').value))}function next(){let p=getPool();$('#pool').textContent=p.length;if(!p.length)return;cur=p[Math.floor(Math.random()*p.length)];selected=null;revealed=false;renderQ()}function renderQ(){$('#tags').innerHTML=`<span class="tag">${cur.module}</span><span class="tag">${cur.typeName}</span>`;$('#qid').textContent=`#${cur.id}`;$('#qtext').textContent=cur.q;$('#imgs').innerHTML=cur.images.map(x=>`<img class="qimg" src="${x}">`).join('');$('#answer').className='answer';$('#addWrong').textContent=S.wrong[cur.id]?'已在错题速记':'加入错题速记';$('#options').innerHTML=cur.options.map(o=>`<button class="option" data-k="${o.key}"><b>${o.key}.</b> ${o.text}</button>`).join('');$$('.option').forEach(b=>b.onclick=()=>{if(revealed)return;selected=b.dataset.k;$$('.option').forEach(x=>x.classList.toggle('selected',x===b))});$('#answerBtn').textContent=cur.options.length?'提交答案':'查看答案'}
function addWrong(id){let q=Q.find(x=>x.id==id);S.wrong[id]=S.wrong[id]||{module:q.module,knowledge:'',reason:'',memory:'',status:'未掌握'};save();if(cur&&cur.id==id)$('#addWrong').textContent='已在错题速记'}function answer(){if(revealed){next();return}let obj=cur.options.length>0;if(obj&&!selected)return alert('请先选择答案');revealed=true;let ok=obj&&selected===cur.answer;S.attempts++;session.done++;S.mods[cur.module]=S.mods[cur.module]||{a:0,c:0};S.mods[cur.module].a++;if(obj){S.objective++;if(ok){S.correct++;session.correct++;S.mods[cur.module].c++}else addWrong(cur.id);$$('.option').forEach(b=>{if(b.dataset.k===cur.answer)b.classList.add('correct');else if(b.dataset.k===selected)b.classList.add('wrong')})}save();$('#answer').className='answer show';$('#answer').innerHTML=`<b>参考答案：</b>${cur.answer||'原题未标注'}${obj?'':`<p><button class="btn" onclick="rate(false)">未掌握</button> <button class="btn primary" onclick="rate(true)">已掌握</button></p>`}`;$('#answerBtn').textContent='下一题';$('#sdone').textContent=session.done;$('#scorrect').textContent=session.correct}function rate(ok){if(ok)S.mods[cur.module].c++;else addWrong(cur.id);save()}$('#answerBtn').onclick=answer;$('#random').onclick=next;$('#module').onchange=next;$('#type').onchange=next;$('#addWrong').onclick=()=>addWrong(cur.id);
function renderWrong(){let m=$('#wrongModule').value,ids=Object.keys(S.wrong).filter(id=>m==='all'||S.wrong[id].module===m);$('#wrongList').innerHTML=ids.length?ids.map(id=>{let q=Q.find(x=>x.id==id),n=S.wrong[id];return `<div class="wrong"><h3><span class="tag">${q.module}</span>${q.typeName} #${q.id}</h3><p>${q.q}</p><p><b>答案：</b>${q.answer}</p><div class="notegrid"><textarea data-f="knowledge" data-id="${id}" placeholder="知识点速记">${n.knowledge}</textarea><textarea data-f="reason" data-id="${id}" placeholder="错误原因">${n.reason}</textarea><textarea data-f="memory" data-id="${id}" placeholder="正确结论或记忆句">${n.memory}</textarea><select data-f="status" data-id="${id}"><option>未掌握</option><option ${n.status==='复测中'?'selected':''}>复测中</option><option ${n.status==='已掌握'?'selected':''}>已掌握</option></select></div><div class="note-actions"><span>${n.status}</span><button class="btn danger" data-del="${id}">移除</button></div></div>`}).join(''):'<div class="panel empty">暂无错题速记。</div>';$$('[data-f]').forEach(x=>x.onchange=()=>{S.wrong[x.dataset.id][x.dataset.f]=x.value;save();renderWrong()});$$('[data-del]').forEach(x=>x.onclick=()=>{delete S.wrong[x.dataset.del];save();renderWrong()})}$('#wrongModule').onchange=renderWrong;$('#clearMastered').onclick=()=>{Object.keys(S.wrong).forEach(id=>{if(S.wrong[id].status==='已掌握')delete S.wrong[id]});save();renderWrong()};$('#exportNotes').onclick=()=>{let text=Object.entries(S.wrong).map(([id,n])=>{let q=Q.find(x=>x.id==id);return `${q.module}｜${q.typeName} #${id}\n${q.q}\n答案：${q.answer}\n知识点：${n.knowledge}\n错误原因：${n.reason}\n记忆句：${n.memory}\n状态：${n.status}\n`}).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text]));a.download='错题知识点速记.txt';a.click()};
function knowledge(m=M[0]){$('#knav').innerHTML=M.map(x=>`<button class="${x===m?'active':''}" data-m="${x}">${x}</button>`).join('');let q=Q.filter(x=>x.module===m),c={};q.forEach(x=>c[x.typeName]=(c[x.typeName]||0)+1);$('#kbody').innerHTML=`<h2>${m}</h2><p>本模块共 <b>${q.length}</b> 道题。</p><table class="table"><tr><th>题型</th><th>数量</th></tr>${Object.entries(c).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`;$$('[data-m]').forEach(b=>b.onclick=()=>knowledge(b.dataset.m))}home();knowledge();next();
</script></body></html>
